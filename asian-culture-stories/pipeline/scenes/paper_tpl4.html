<!doctype html><meta charset=utf8><link rel=stylesheet href="../fonts.css"><style>@font-face{font-family:NSJP113;src:url(noto-serif-jp-113-700-normal.woff2);font-weight:700}html,body{margin:0;background:#000;position:relative}canvas{display:block}#ov{position:absolute;left:0;top:0}</style>
<canvas id=c width=1280 height=720></canvas><canvas id=ov width=1280 height=720></canvas>
<script>
const c=document.getElementById('c');const gl=c.getContext('webgl',{preserveDrawingBuffer:true,antialias:true});
const vs=`attribute vec2 p;varying vec2 vS;void main(){vS=vec2(p.x*.5+.5,1.-(p.y*.5+.5));gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;varying vec2 vS;uniform sampler2D uA,uC,uB,uS;uniform vec3 uF0,uF1;uniform vec2 uBl,uSm;uniform vec4 uRev;uniform float uT,uZoom,uFlash,uDark,uSunOn;uniform vec2 uCam;uniform vec4 uR[8],uP[8],uQ[8];uniform vec3 uSun,uSunCol,uSky;uniform vec4 uCloud;
void main(){vec2 uv=vec2(uCam.x+(vS.x-.5)/uZoom,uCam.y+(vS.y-.5)*0.8438/uZoom);vec2 p=uv;
 for(int i=0;i<8;i++){vec4 r=uR[i];if(r.z>0.){vec2 d=(uv-r.xy)/r.zw;float m=smoothstep(1.,.45,length(d));vec2 pv=uP[i].xy;float a=uP[i].z*m;vec2 q=p-pv;q.x*=1.5;float ca=cos(a),sa=sin(a);q=vec2(ca*q.x+sa*q.y,-sa*q.x+ca*q.y);q.x/=1.5;p=pv+q;p.y-=uP[i].w*m;p.x-=uQ[i].x*m*clamp((pv.y-uv.y)/max(r.w,.001),-1.,1.);}}
 vec4 col=texture2D(uA,clamp(p,0.,1.));
 if(uF0.z>0.){float mk=smoothstep(1.,.55,length((p-uF0.xy)*vec2(1.5,1.))/uF0.z);col=mix(col,texture2D(uB,clamp(p,0.,1.)),mk*uBl.x);col=mix(col,texture2D(uS,clamp(p,0.,1.)),mk*uSm.x);}
 if(uF1.z>0.){float mk=smoothstep(1.,.55,length((p-uF1.xy)*vec2(1.5,1.))/uF1.z);col=mix(col,texture2D(uB,clamp(p,0.,1.)),mk*uBl.y);col=mix(col,texture2D(uS,clamp(p,0.,1.)),mk*uSm.y);}float sky=1.-smoothstep(.07,.16,length(col.rgb-uSky));
 if(uSunOn>0.){float d=length((uv-uSun.xy)*vec2(1.5,1.));float disc=smoothstep(uSun.z,uSun.z*.985,d);col.rgb+=uSunCol*exp(-d/(uSun.z*2.2))*.16*sky*uSunOn;col.rgb=mix(col.rgb,uSunCol,disc*sky*uSunOn);}
 if(uCloud.x>0.){float cl=texture2D(uC,vec2(uv.x*1.1+uT*uCloud.y,uv.y*3.2)).a*.7+texture2D(uC,vec2(uv.x*.8-uT*uCloud.y*.6+.4,uv.y*2.4+.2)).a*.5;col.rgb=mix(col.rgb,vec3(.97,.93,.84),clamp(cl,0.,1.)*sky*uCloud.w*step(uv.y,uCloud.z));}
 float mR=0.;if(uRev.w>0.){float dd=length((vS-uRev.xy)*vec2(1.7778,1.));mR=smoothstep(uRev.z,uRev.z-.05,dd);col.rgb+=vec3(1.,.82,.45)*smoothstep(.035,0.,abs(dd-uRev.z))*.55;col.rgb+=vec3(1.,.85,.5)*exp(-dd/max(uRev.z,.01))*.12*mR;}
 col.rgb+=uFlash;col.rgb*=1.-uDark*(1.-mR);gl_FragColor=col;}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
function tex(img,unit,rep){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);const w=rep?gl.REPEAT:gl.CLAMP_TO_EDGE;gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,w);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,w)}
function cloudTex(){const cv=document.createElement('canvas');cv.width=1024;cv.height=256;const x=cv.getContext('2d');x.fillStyle='#fff';
 function cloud(cx,cy,s){x.beginPath();[[-1.6,.2,.7],[-.9,-.1,.95],[0,-.3,1.15],[.9,-.05,.95],[1.6,.25,.7]].forEach(([dx,dy,r])=>{x.moveTo(cx+dx*s+r*s,cy+dy*s);x.arc(cx+dx*s,cy+dy*s,r*s,0,6.283)});x.fill();x.fillRect(cx-1.7*s,cy+.1*s,3.4*s,.65*s)}
 const R=i=>{let v=Math.sin(i*127.1)*43758.5453;return v-Math.floor(v)};
 for(let i=0;i<4;i++){const cx=(i+.5)*256,cy=80+R(i)*100,s=24+R(i+3)*14;cloud(cx,cy,s);cloud(cx-1024,cy,s);cloud(cx+1024,cy,s)}return cv}
const ld=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
let SKY=[.9,.8,.5];
window.ready=(async()=>{const a=await ld('__A__');tex(a,0,false);tex(cloudTex(),1,true);tex(await ld('__B__'),2,false);tex(await ld('__S__'),3,false);gl.uniform1i(U('uA'),0);gl.uniform1i(U('uC'),1);gl.uniform1i(U('uB'),2);gl.uniform1i(U('uS'),3);
 const t=document.createElement('canvas');t.width=a.width;t.height=a.height;const x=t.getContext('2d');x.drawImage(a,0,0);const d=x.getImageData(Math.floor(a.width*.5),Math.floor(a.height*.04),1,1).data;SKY=[d[0]/255,d[1]/255,d[2]/255];
 await document.fonts.ready;await document.fonts.load('700 40px NSJP113','神道');await document.fonts.load('600 30px Lora')})();
const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
window.draw=function(t,o){gl.viewport(0,0,1280,720);const k=ease(t/o.dur);
 const z=o.z0+(o.z1-o.z0)*k;const f0=o.f0||[.5,.5],f1=o.f1||f0;
 let fx=f0[0]+(f1[0]-f0[0])*k,fy=f0[1]+(f1[1]-f0[1])*k;fx=Math.max(.5/z+.002,Math.min(1-.5/z-.002,fx));fy=Math.max(.4219/z+.002,Math.min(1-.4219/z-.002,fy));
 gl.uniform1f(U('uZoom'),z);gl.uniform2f(U('uCam'),fx,fy);gl.uniform1f(U('uT'),t+(o.t0||0));
 const R=new Float32Array(32),P=new Float32Array(32),Q=new Float32Array(32);
 (o.regs||[]).slice(0,8).forEach((g,i)=>{const T=t+(o.t0||0);const w=(a)=>a?a[0]*Math.sin(T*a[1]*6.283+(a[2]||0)):0;
  R.set([g.c[0],g.c[1],g.r[0],g.r[1]],i*4);P.set([(g.piv||g.c)[0],(g.piv||g.c)[1],w(g.rot),Math.abs(g.bobabs?Math.abs(w(g.bob)):0)+(g.bobabs?0:w(g.bob))],i*4);Q.set([w(g.shear),0,0,0],i*4)});
 gl.uniform4fv(U('uR'),R);gl.uniform4fv(U('uP'),P);gl.uniform4fv(U('uQ'),Q);
 const s=o.sun;gl.uniform1f(U('uSunOn'),s?1:0);if(s){const sy=s[1]+(s[2]-s[1])*k;gl.uniform3f(U('uSun'),s[0],sy,s[3]);gl.uniform3f(U('uSunCol'),.78,.27,.19)}else{gl.uniform3f(U('uSun'),0,0,.1);gl.uniform3f(U('uSunCol'),.78,.27,.19)}
 gl.uniform3f(U('uSky'),SKY[0],SKY[1],SKY[2]);
 const cl=o.cloud;gl.uniform4f(U('uCloud'),cl?1:0,cl?cl[0]:0,cl?cl[1]:0,cl?cl[2]:0);
 const fl=o.flash?(Math.max(0,1-Math.abs(t-o.flash[0])/0.07)*.55+Math.max(0,1-Math.abs(t-o.flash[1])/0.06)*.4):0;
 gl.uniform1f(U('uFlash'),fl);
 let dk=o.dark?o.dark[0]+(o.dark[1]-o.dark[0])*k:0;if(o.fadeIn)dk=Math.max(dk,1-Math.min(1,t/o.fadeIn));if(o.fadeOut)dk=Math.max(dk,1-Math.min(1,Math.max(0,(o.dur-t)/o.fadeOut)));
 if(o.lightUp)dk=Math.max(dk,Math.max(0,1-t/o.lightUp)*.85);if(o.darkRamp)dk=Math.min(1,t/o.darkRamp);if(o.darkConst!==undefined)dk=o.darkConst;gl.uniform1f(U('uDark'),dk);
 const F=o.faces||[];const bl=i=>{const L=o.blinks?o.blinks.map(b=>b+i*.35):[...Array(6)].map((_,k)=>.6+i*.9+k*3.3);return L.some(b=>Math.abs(t-b)<.09)?1:(L.some(b=>Math.abs(t-b)<.14)?.5:0)};
 const sml=()=>o.smile?Math.min(1,Math.max(0,(t-o.smile[0])/(o.smile[1]-o.smile[0]))):0;
 gl.uniform3f(U('uF0'),...(F[0]||[0,0,0]));gl.uniform3f(U('uF1'),...(F[1]||[0,0,0]));gl.uniform2f(U('uBl'),bl(0),bl(1));gl.uniform2f(U('uSm'),sml(),0);
 const rv=o.reveal;if(rv&&t>=rv[4]){const q=Math.min(1,(t-rv[4])/rv[5]);const e=q*q*(3-2*q);gl.uniform4f(U('uRev'),rv[0],rv[1],rv[2]+(rv[3]-rv[2])*e,1)}else gl.uniform4f(U('uRev'),0,0,0,0);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);overlay(t,o)}
const ov=document.getElementById('ov').getContext('2d');const sm=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
function petals(t,o){if(!o.petals)return;const R=i=>{let v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};const T=t+(o.t0||0);
 for(let i=0;i<14;i++){const sp=.5+R(i)*.8,per=(780)/(16*sp),tt=(T+R(i+3)*per)%per;const y=-30+tt*16*sp,x=(R(i+1)*1280+Math.sin(tt*.8+R(i+9)*6)*45+tt*6)%1280,s=6+R(i+5)*7;
  ov.save();ov.translate(x,y);ov.rotate(tt*.7+R(i+9)*6);ov.globalAlpha=.78;ov.fillStyle=i%3?'#f6e3d0':'#f0c8bf';ov.beginPath();ov.ellipse(0,0,s,s*.62,0,0,6.283);ov.fill();ov.restore()}}
function overlay(t,o){ov.clearRect(0,0,1280,720);petals(t,o);
 (o.text||[]).forEach(it=>{const lt=t-it.t0;if(lt<0||lt>it.t1-it.t0+0.2)return;const out=sm((it.t1-t)/0.2);const sz=it.size||26;
  ov.save();ov.globalAlpha=Math.min(1,lt/0.12)*out;ov.letterSpacing=(sz*0.16)+'px';ov.font=`600 ${sz}px Lora`;
  const widths=it.parts.map(p=>ov.measureText(p.t).width);const tw=widths.reduce((a,b)=>a+b,0);const h=sz*2.0,seal=h-12,pad=18;
  const W=seal+pad*2+tw+14;const x0=it.x-(1-sm(lt/0.35))*26,y0=it.y;
  ov.beginPath();ov.rect(x0,y0-6,W*sm(lt/0.4),h+12);ov.clip();
  ov.fillStyle='rgba(247,236,210,.9)';ov.fillRect(x0,y0,W,h);ov.strokeStyle='#6b3a1d';ov.lineWidth=1.6;ov.strokeRect(x0+3,y0+3,W-6,h-6);
  ov.fillStyle='#b5121f';ov.fillRect(x0+10,y0+6,seal,seal);ov.letterSpacing='0px';ov.font=`700 ${seal*0.72}px NSJP113`;ov.fillStyle='#fbf1dc';ov.textAlign='center';ov.textBaseline='middle';ov.fillText(it.seal||'神',x0+10+seal/2,y0+6+seal/2+2);
  ov.textAlign='left';ov.textBaseline='alphabetic';ov.letterSpacing=(sz*0.16)+'px';ov.font=`600 ${sz}px Lora`;let x=x0+10+seal+pad;const by=y0+h/2+sz*0.34;
  it.parts.forEach((p,k)=>{ov.fillStyle='#3a1f12';ov.fillText(p.t,x,by);if(p.hl){ov.strokeStyle='#b5121f';ov.lineWidth=4;ov.lineCap='round';ov.beginPath();ov.moveTo(x,by+7);ov.quadraticCurveTo(x+widths[k]*.5,by+12,x+widths[k]-6,by+6);ov.stroke()}x+=widths[k]});
  ov.restore()});
 const g=ov.createRadialGradient(640,360,330,640,360,860);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(40,20,10,.28)');ov.fillStyle=g;ov.fillRect(0,0,1280,720)}
</script>
