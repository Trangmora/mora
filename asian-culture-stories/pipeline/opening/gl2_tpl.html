<!doctype html><meta charset=utf8><link rel=stylesheet href="../fonts.css"><style>html,body{margin:0;background:#000;position:relative}canvas{display:block}#ov{position:absolute;left:0;top:0}</style><canvas id=c width=1280 height=720></canvas><canvas id=ov width=1280 height=720></canvas>
<script>
const c=document.getElementById('c');const gl=c.getContext('webgl',{preserveDrawingBuffer:true,antialias:true});
const vs=`attribute vec2 p;uniform float uNod,uYaw,uPitch,uZoom,uDepth,uBreath;uniform vec2 uHead,uFocus,uShake;uniform sampler2D uD;varying vec2 vUv;
void main(){vec2 uv=p*.5+.5;uv.y=1.-uv.y;vUv=uv;float d=texture2D(uD,uv).r;
 vec3 q=vec3((uv.x-.5)*3.0,(.5-uv.y)*2.0,(d-.45)*uDepth);
 vec2 hc=vec2((uHead.x-.5)*3.0,(.5-uHead.y)*2.0);float m=smoothstep(.62,.18,length((uv-uHead)*vec2(1.5,1.0)));
 vec3 pv=vec3(hc.x,hc.y-.55,.0);vec3 r=q-pv;float a=uNod*m;float ca=cos(a),sa=sin(a);r=vec3(r.x,r.y*ca-r.z*sa,r.y*sa+r.z*ca);q=pv+r;
 q.y+=uBreath*m*0.5;
 q.xy-=vec2((uFocus.x-.5)*3.0,(.5-uFocus.y)*2.0);
 float cy=cos(uYaw),sy=sin(uYaw);q=vec3(q.x*cy+q.z*sy,q.y,-q.x*sy+q.z*cy);
 float cp=cos(uPitch),sp=sin(uPitch);q=vec3(q.x,q.y*cp-q.z*sp,q.y*sp+q.z*cp);
 float w=3.0/(3.0-q.z);gl_Position=vec4((q.x/1.5)*w*uZoom+uShake.x,q.y*1.185*w*uZoom+uShake.y,0.,1.);}`;
const fs=`precision mediump float;uniform sampler2D uA,uB,uD,uC;uniform float uBlink,uTime;uniform vec3 uMoon;uniform vec3 uWater;uniform vec3 uCloud;varying vec2 vUv;
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){vec2 uv=vUv;float H=uWater.x;
 if(uWater.y>0.&&uv.y>H){float k=uv.y-H;uv.x+=(sin(uv.y*140.+uTime*1.6)*0.0022+sin(uv.y*55.-uTime*1.1)*0.0016)*k*6.*uWater.y;uv.y+=sin(uv.x*90.+uTime*1.3)*0.0012*k*4.*uWater.y;}
 vec4 col=mix(texture2D(uA,uv),texture2D(uB,uv),uBlink);float dep=texture2D(uD,vUv).r;
 if(uMoon.z>0.){vec2 p=(uv-vec2(uMoon.x,uMoon.y))*vec2(1.5,1.0);float r=uMoon.z;float d=length(p);
  float sky=step(dep,0.2)*step(uv.y,uWater.z>0.?uWater.z:H);
  float disc=smoothstep(r,r*0.985,d);float cr=h21(floor(uv*vec2(420.,280.)))*0.07;
  vec3 mc=vec3(0.91,0.86,0.72)-cr-0.05*smoothstep(0.0,r,length(p-vec2(-0.2*r,0.3*r)))*0.0;
  mc-=0.04*smoothstep(r*0.25,0.0,length(p-vec2(0.35*r,-0.2*r)))+0.03*smoothstep(r*0.2,0.0,length(p-vec2(-0.3*r,0.35*r)));
  col.rgb+=vec3(0.9,0.8,0.55)*exp(-d/(r*1.8))*0.16*sky;
  col.rgb=mix(col.rgb,mc,disc*sky);
  if(uv.y>H){float ry=2.*H-uMoon.y;vec2 q=(uv-vec2(uMoon.x+sin(uv.y*200.+uTime*2.)*0.004,ry))*vec2(1.5,0.45);float dd=length(q);col.rgb+=vec3(0.9,0.8,0.55)*smoothstep(r,r*0.4,dd)*0.28*(0.6+0.4*sin(uv.y*260.+uTime*3.))*step(0.0,uMoon.y-H*0.0);}
 }
 if(uCloud.x>0.){float m=smoothstep(0.62,0.4,dep)*smoothstep(0.22,0.34,uv.y)*smoothstep(0.78,0.6,uv.y);
  vec2 c1=vec2(uv.x*1.4+uTime*0.012*uCloud.y,uv.y*3.2);vec2 c2=vec2(uv.x*0.9-uTime*0.008*uCloud.y+0.37,uv.y*2.4+0.2);
  float a=texture2D(uC,c1).a*0.55+texture2D(uC,c2).a*0.4;col.rgb=mix(col.rgb,vec3(0.86,0.84,0.72),clamp(a,0.,1.)*m*0.72);}
 gl_FragColor=col;}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const NX=240,NY=160;const pos=[];for(let j=0;j<=NY;j++)for(let i=0;i<=NX;i++)pos.push(i/NX*2-1,j/NY*2-1);
const idx=[];for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const a=j*(NX+1)+i;idx.push(a,a+1,a+NX+1,a+1,a+NX+2,a+NX+1)}
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(idx),gl.STATIC_DRAW);gl.getExtension('OES_element_index_uint');
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
function tex(img,unit){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);const w=unit==3?gl.REPEAT:gl.CLAMP_TO_EDGE;gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,w);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,w)}
function cloudTex(){const cv=document.createElement('canvas');cv.width=1024;cv.height=256;const x=cv.getContext('2d');x.fillStyle='#fff';
 function cloud(cx,cy,s){x.beginPath();const lobes=[[-1.6,.2,.7],[-.9,-.1,.95],[0,-.3,1.15],[.9,-.05,.95],[1.6,.25,.7]];lobes.forEach(([dx,dy,r])=>{x.moveTo(cx+dx*s+r*s,cy+dy*s);x.arc(cx+dx*s,cy+dy*s,r*s,0,6.283)});x.fill();x.fillRect(cx-1.7*s,cy+.1*s,3.4*s,.65*s)}
 const R=i=>{let v=Math.sin(i*127.1)*43758.5453;return v-Math.floor(v)};
 for(let i=0;i<5;i++){const cx=(i+.5)*205,cy=70+R(i)*110,s=22+R(i+3)*14;cloud(cx,cy,s);cloud(cx-1024,cy,s);cloud(cx+1024,cy,s)}
 return cv}
const ld=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
window.ready=(async()=>{const a=await ld('__A__');tex(a,0);tex(__B__?await ld('__B__'):a,1);tex(await ld('__D__'),2);tex(cloudTex(),3);gl.uniform1i(U('uA'),0);gl.uniform1i(U('uB'),1);gl.uniform1i(U('uD'),2);gl.uniform1i(U('uC'),3);gl.getExtension('OES_texture_float');await document.fonts.ready;await document.fonts.load("800 90px 'Be Vietnam Pro'")})();
const ease=x=>x<=0?0:x>=1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
window.draw=function(t,o){gl.viewport(0,0,1280,720);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
 const k=ease(t/o.dur);const punch=o.punch===undefined?0.06:o.punch;
 const z=(o.z0+(o.z1-o.z0)*k)*(1+punch*Math.exp(-t*8));
 const nod=o.nod?(Math.sin(t*3.6)*Math.exp(-t*.25)*.10*o.nod+Math.sin(t*1.3)*.03):0;
 const bl=(o.blink||[]).some(b=>t>b&&t<b+0.13)?1:0;
 const sk=o.shake?Math.exp(-t*14)*o.shake:0;
 gl.uniform1f(U('uNod'),nod);gl.uniform1f(U('uYaw'),o.y0+(o.y1-o.y0)*k);gl.uniform1f(U('uPitch'),(o.p||0)*Math.sin(t*.7));gl.uniform1f(U('uZoom'),z);gl.uniform1f(U('uDepth'),o.depth||0.9);
 gl.uniform1f(U('uBreath'),Math.sin(t*1.9)*0.012);gl.uniform2f(U('uHead'),.36,.35);const f0=o.f0||[.5,.5],f1=o.f1||f0;gl.uniform2f(U('uFocus'),f0[0]+(f1[0]-f0[0])*k,f0[1]+(f1[1]-f0[1])*k);
 gl.uniform2f(U('uShake'),sk*Math.sin(t*90)*0.012,sk*Math.cos(t*77)*0.012);gl.uniform1f(U('uBlink'),bl);
 gl.uniform1f(U('uTime'),t+(o.t0||0));const mo=o.moon;gl.uniform3f(U('uMoon'),mo?mo[0]:0,mo?mo[1]+(mo[2]-mo[1])*k:0,mo?mo[3]:0);
 gl.uniform3f(U('uWater'),o.waterH||0.62,o.water||0,o.moonH||0);gl.uniform3f(U('uCloud'),o.cloud?1:0,o.cloud||0,0);
 gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_INT,0);overlay(t,o)}
const ov=document.getElementById('ov').getContext('2d');
const RR=i=>{let v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const sm=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
function overlay(t,o){ov.clearRect(0,0,1280,720);const T=t+(o.t0||0);
 for(let i=0;i<24;i++){const sp=.5+RR(i)*1.4,sz=2+RR(i+5)*5*sp,ph=RR(i+9)*6.28,per=(720+80)/(24*sp),tt=(T+RR(i+3)*per)%per;const y=-40+tt*24*sp,x=(RR(i+1)*1280+Math.sin(tt*1.2+ph)*40+tt*8)%1280;
  ov.globalAlpha=.5*sp/2;ov.fillStyle=i%3?'#e6d6a8':'#e9c27a';ov.beginPath();ov.ellipse(x,y,sz,sz*.7,tt+ph,0,6.28);ov.fill()}
 ov.globalAlpha=1;
 (o.text||[]).forEach(it=>{const lt=t-it.t0;if(lt<0||lt>it.t1-it.t0+0.15)return;const out=sm((it.t1-t)/0.15);
  const pop=sm(lt/0.14);const ov_=1+0.12*Math.sin(Math.min(1,lt/0.22)*Math.PI);
  ov.save();ov.translate(it.x,it.y);ov.rotate((it.rot||-0.025));ov.globalAlpha=Math.min(1,lt/0.06)*out;
  let y=0;it.lines.forEach(L=>{const size=L.size||110;ov.font=`800 ${size}px 'Be Vietnam Pro'`;ov.textBaseline='alphabetic';
   const parts=L.parts;let widths=parts.map(p=>ov.measureText(p.t).width+(p.hl?size*.28:0)+size*.08);const tw=widths.reduce((a,b)=>a+b,0);let x=-tw/2;
   parts.forEach((p,i)=>{const w=widths[i];if(p.hl){const wipe=sm((lt-0.05-i*0.04)/0.2);ov.fillStyle='#e8112d';const bh=size*1.05;ov.fillRect(x,y-size*.86,(w-size*.08)*wipe,bh);}
    ov.save();ov.translate(x+(p.hl?size*.14:0),y);ov.scale(ov_,ov_);ov.fillStyle=p.hl?'#ffffff':'#f6f0dc';ov.shadowColor='rgba(0,0,0,.6)';ov.shadowBlur=14;ov.shadowOffsetY=4;ov.fillText(p.t,0,0);ov.restore();x+=w});
   y+=size*1.12});
  ov.restore()})
}
</script>
