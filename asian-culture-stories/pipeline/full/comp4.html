<!doctype html><meta charset=utf8><link rel=stylesheet href="../fonts.css"><style>@font-face{font-family:NSJP113;src:url(noto-serif-jp-113-700-normal.woff2);font-weight:700}html,body{margin:0}</style><canvas id=c width=1280 height=720></canvas><script>
const x=document.getElementById("c").getContext("2d");const L=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src="data:image/jpeg;base64,"+s});
const SP={};window.loadSp=async(d)=>{for(const k in d){SP[k]=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src="data:image/png;base64,"+d[k]})}await document.fonts.load('700 40px NSJP113','神');await document.fonts.load('600 30px Lora');await document.fonts.load("600 30px 'Be Vietnam Pro'")};
const E=p=>0.5-0.5*Math.cos(Math.PI*Math.min(1,Math.max(0,p)));const sm=p=>p<=0?0:p>=1?1:p*p*(3-2*p);
window.single=async(a)=>{x.drawImage(await L(a),0,0)};
window.cross=async(a,b,p)=>{const A=await L(a),B=await L(b);x.globalAlpha=1;x.drawImage(A,0,0);x.globalAlpha=E(p);x.drawImage(B,0,0);x.globalAlpha=1};
window.flower=async(a,b,p,spec)=>{const A=await L(a),B=await L(b);const Z=1.08,k=1280*Z/1536;
 const sc=(u,v)=>[(.5+(u-.5)*Z)*1280,(.5+(v-.5)*Z/0.8438)*720];const cA=sc(spec.a[0],spec.a[1]),cB=sc(spec.b[0],spec.b[1]);const q=Math.pow(Math.min(1,Math.max(0,p)),1.7);
 const cx=cA[0]+(cB[0]-cA[0])*q,cy=cA[1]+(cB[1]-cA[1])*q-Math.sin(Math.PI*q)*90;const r=1700*Math.pow(E(p),1.1);
 x.drawImage(A,0,0);x.save();x.beginPath();x.arc(cx,cy,Math.max(.01,r),0,6.283);x.clip();x.drawImage(B,0,0);x.restore();
 if(r>2){x.save();x.beginPath();x.arc(cx,cy,r,0,6.283);x.lineWidth=7;x.strokeStyle="rgba(246,233,207,.92)";x.shadowColor="rgba(40,20,10,.5)";x.shadowBlur=14;x.stroke();x.restore()}
 const S0=SP[spec.sp];const sA=S0.width*k,sB=spec.bw*k;const sz=sA+(sB-sA)*E(p);const pop=1+.25*Math.sin(Math.PI*Math.min(1,p*1.4));
 x.save();x.translate(cx,cy);x.rotate(p*2.2);x.globalAlpha=p>.9?Math.max(0,1-(p-.9)/.1):1;x.shadowColor="rgba(40,20,10,.45)";x.shadowBlur=12;x.shadowOffsetY=4;x.drawImage(S0,-sz*pop/2,-sz*pop/2*S0.height/S0.width,sz*pop,sz*pop*S0.height/S0.width);x.restore()};
const J=y=>Math.sin(y*.031)*18+Math.sin(y*.083+1.3)*9+Math.sin(y*.21+.4)*5+Math.sin(y*.57)*2.5;
window.tear=async(a,b,p)=>{const A=await L(a),B=await L(b);const e=E(p);const X=1280*(1.08-1.25*e);
 x.drawImage(B,0,0);
 // shadow cast by the old sheet on the new scene
 x.save();x.beginPath();x.moveTo(-50,-10);for(let y=-10;y<=730;y+=6)x.lineTo(X+J(y)+14,y);x.lineTo(-50,730);x.closePath();x.fillStyle="rgba(30,15,8,.28)";x.filter="blur(10px)";x.fill();x.restore();
 // old sheet, lifted slightly as it is torn away
 x.save();x.beginPath();x.moveTo(-50,-10);for(let y=-10;y<=730;y+=6)x.lineTo(X+J(y),y);x.lineTo(-50,730);x.closePath();x.clip();x.translate(-e*40,-Math.sin(Math.PI*e)*8);x.rotate(-e*.01);x.drawImage(A,0,0);x.restore();
 // white paper fibres along the torn edge
 x.save();x.beginPath();for(let y=-10;y<=730;y+=4){const w=5+Math.abs(Math.sin(y*.7)*4+Math.sin(y*.23)*3);x.lineTo(X+J(y)-e*40+w,y)}for(let y=730;y>=-10;y-=4)x.lineTo(X+J(y)-e*40,y);x.closePath();x.fillStyle="rgba(250,244,230,.97)";x.fill();x.restore()};
window.labels=(items,t)=>{(items||[]).forEach(it=>{const lt=t-it.t0;if(lt<0||lt>it.t1-it.t0+.2)return;const out=sm((it.t1-t)/.2);const sz=it.size||26;const fam=it.font||'Lora';
 x.save();x.globalAlpha=Math.min(1,lt/.12)*out;x.letterSpacing=(sz*.16)+'px';x.font=`600 ${sz}px ${fam}`;
 const widths=it.parts.map(p=>x.measureText(p.t).width);const tw=widths.reduce((a,b)=>a+b,0);const h=sz*2,seal=h-12,pad=18;const W=seal+pad*2+tw+14;const x0=it.x-(1-sm(lt/.35))*26,y0=it.y;
 x.beginPath();x.rect(x0,y0-6,W*sm(lt/.4),h+12);x.clip();x.fillStyle='rgba(247,236,210,.9)';x.fillRect(x0,y0,W,h);x.strokeStyle='#6b3a1d';x.lineWidth=1.6;x.strokeRect(x0+3,y0+3,W-6,h-6);
 x.fillStyle='#b5121f';x.fillRect(x0+10,y0+6,seal,seal);x.letterSpacing='0px';x.font=`700 ${seal*.72}px NSJP113`;x.fillStyle='#fbf1dc';x.textAlign='center';x.textBaseline='middle';x.fillText('神',x0+10+seal/2,y0+6+seal/2+2);
 x.textAlign='left';x.textBaseline='alphabetic';x.letterSpacing=(sz*.16)+'px';x.font=`600 ${sz}px ${fam}`;let xx=x0+10+seal+pad;const by=y0+h/2+sz*.34;
 it.parts.forEach((p,k)=>{x.fillStyle='#3a1f12';x.fillText(p.t,xx,by);if(p.hl){x.strokeStyle='#b5121f';x.lineWidth=4;x.lineCap='round';x.beginPath();x.moveTo(xx,by+7);x.quadraticCurveTo(xx+widths[k]*.5,by+12,xx+widths[k]-6,by+6);x.stroke()}xx+=widths[k]});x.restore()})};
</script>
